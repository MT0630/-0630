name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoTapper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoTapper-apk
          path: AutoTapper.apk

      # スマホから直接ダウンロードできるよう「latest」リリースに最新APKを置く
      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AutoTapper.apk \
            --title "AutoTapper（最新ビルド）" \
            --notes "AutoTapper.apk をタップしてダウンロード → インストールしてください。"
